upstream oba_gtfsrt { server 127.0.0.1:8083; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ec2-52-70-255-34.compute-1.amazonaws.com _;

    client_max_body_size 1k;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # Hardcoded backend paths drop the client query string, neutralizing
    # ?debug= (text dump) and ?time= (cache-bypass CPU DoS).
    location = /tripUpdates {
        limit_except GET HEAD { deny all; }
        limit_req zone=gtfsrt burst=20 nodelay;
        proxy_pass http://oba_gtfsrt/tripUpdates;
    }
    location = /vehiclePositions {
        limit_except GET HEAD { deny all; }
        limit_req zone=gtfsrt burst=20 nodelay;
        proxy_pass http://oba_gtfsrt/vehiclePositions;
    }
    location = /alerts {
        limit_except GET HEAD { deny all; }
        limit_req zone=gtfsrt burst=20 nodelay;
        proxy_pass http://oba_gtfsrt/alerts;
    }

    # Everything else (/, /input/*, /transit-data-service, /configuration-service, ...) denied.
    location / { return 404; }
}
