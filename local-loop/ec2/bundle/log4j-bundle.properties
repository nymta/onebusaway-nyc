# log4j 1.2 config for the bundle build (slf4j-log4j12 is on the builder classpath).
#
# Without a config the build runs with no appenders, so every warning from the bundle tasks is
# discarded - including the STIF loader's report of which trips failed to match GTFS.
#
# Pass with: -Dlog4j.configuration=file:/opt/oba/log4j-bundle.properties

log4j.rootLogger=INFO, CONSOLE

log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.target=System.out
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=%d{ISO8601} %-5p [%c{1}] %m%n

# The STIF import path is the one worth keeping verbose.
log4j.logger.org.onebusaway.nyc.transit_data_federation.bundle.tasks=DEBUG
log4j.logger.org.onebusaway.nyc.transit_data_federation.bundle.tasks.stif=DEBUG

# Hibernate/Spring are extremely chatty during the GTFS load; keep them out of the way.
log4j.logger.org.hibernate=WARN
log4j.logger.org.springframework=WARN
log4j.logger.net.sf.ehcache=WARN
