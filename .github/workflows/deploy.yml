name: deploy-oba-prod

# Deploys the OBA-NYC prediction loop to the EC2 host via AWS SSM (no inbound SSH).
# Uses GitHub OIDC to assume an IAM role that may only run SSM RunShellScript on the host.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "deploy = pull+rebuild+restart; set-weights = fast weight change (no restart)"
        type: choice
        options: [deploy, set-weights]
        default: deploy
      ref:
        description: "git ref/branch to deploy (main repo)"
        default: rsen/ec2-productionize-gtfs-rt
      schedule:
        description: "SCHEDULE weight % (set-weights)"
        default: "20"
      historical:
        description: "HISTORICAL weight % (set-weights)"
        default: "40"
      recent:
        description: "RECENT weight % (set-weights)"
        default: "40"

permissions:
  id-token: write
  contents: read

concurrency: oba-prod-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate weights sum to 100 (set-weights only)
        if: ${{ inputs.action == 'set-weights' }}
        run: |
          total=$(( ${{ inputs.schedule }} + ${{ inputs.historical }} + ${{ inputs.recent }} ))
          echo "sum = $total"
          [ "$total" -eq 100 ] || { echo "::error::weights must sum to 100"; exit 1; }

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OBA_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Run deploy.sh on the host via SSM
        env:
          INSTANCE_ID: ${{ vars.OBA_INSTANCE_ID }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.action }}" = "set-weights" ]; then
            CMD="/opt/oba/deploy.sh set-weights ${{ inputs.schedule }} ${{ inputs.historical }} ${{ inputs.recent }}"
          else
            CMD="/opt/oba/deploy.sh deploy ${{ inputs.ref }}"
          fi
          echo "remote command: $CMD"
          PARAMS=$(jq -nc --arg c "$CMD" '{commands:[$c]}')
          CID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "gha ${{ inputs.action }}" \
            --timeout-seconds 3600 --parameters "$PARAMS" \
            --query 'Command.CommandId' --output text)
          echo "CommandId=$CID"
          STATUS=Pending
          for i in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 10
          done
          echo "final status: $STATUS"
          echo "----- STDOUT -----"
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "----- STDERR -----"
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          [ "$STATUS" = "Success" ]
